spring.application.name=UserHub
jwt.secret=UserHub-development-secret-key-must-be-at-least-32-bytes-long
jwt.expiration=86400000

# MySQL. Os valores podem ser substituídos por variáveis de ambiente.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/userhub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:userhub}
spring.datasource.password=${MYSQL_PASSWORD:userhub}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
